<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1d4ed8" />
    <meta name="description" content="Fahrplan für den Stadtbus Deggendorf (Linien 1-4) - Haltestellen, Abfahrtszeiten, Liniennetz." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>Deggendorf Busfahrplan</title>
    <script>
      // Vor dem ersten Paint anwenden, sonst kurzes Aufblitzen des falschen Farbschemas
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
