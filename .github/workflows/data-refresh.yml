name: Data Refresh

# Läuft wöchentlich (Montag früh) und regeneriert die Fahrplan-Bundles aus
# data-pipeline/fallback-data (bzw. künftig gtfs.de, sobald angebunden). Committet
# Änderungen und deployed direkt selbst, da GITHUB_TOKEN-Commits keinen weiteren
# on:push-Workflow (deploy.yml) auslösen.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Datenpipeline neu bauen
        working-directory: data-pipeline
        run: |
          npm ci
          npm run build

      - name: Änderungen committen (falls vorhanden)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- app/public/data; then
            git add app/public/data
            git commit -m "data: Fahrplan-Bundles aktualisiert ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "Keine Änderungen an den Fahrplandaten."
          fi

      - name: App bauen
        working-directory: app
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

      - id: deployment
        uses: actions/deploy-pages@v4
