name: Data Refresh

# Läuft wöchentlich, regeneriert die Fahrplan-Bundles aus data-pipeline/fallback-data
# (künftig ggf. gtfs.de) und deployed bei Änderungen direkt neu auf den VPS - siehe
# deploy.yml für die benötigten Secrets/Variablen.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Datenpipeline neu bauen
        working-directory: data-pipeline
        run: |
          npm ci
          npm run build

      - name: Änderungen committen und pushen (falls vorhanden)
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- app/public/data; then
            git add app/public/data
            git commit -m "data: Fahrplan-Bundles aktualisiert ($(date -u +%Y-%m-%d))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Keine Änderungen an den Fahrplandaten."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: appleboy/ssh-action@v1
        if: steps.commit.outputs.changed == 'true'
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd "${{ vars.VPS_DEPLOY_PATH }}"
            git pull --ff-only
            docker compose up -d --build
