name: Deploy to VPS

# Erfordert folgende Secrets/Variablen im Repo (Settings -> Secrets and variables -> Actions):
#   Secrets:   VPS_HOST, VPS_USER, VPS_SSH_KEY (privater Deploy-Key), optional VPS_PORT
#   Variables: VPS_DEPLOY_PATH (Ordner auf dem VPS, in dem dieses Repo geklont liegt)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd "${{ vars.VPS_DEPLOY_PATH }}"
            git pull --ff-only
            docker compose up -d --build
