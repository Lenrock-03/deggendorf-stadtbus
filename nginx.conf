server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain application/javascript application/json text/css;

    # Fahrplandaten dürfen sich (durch den wöchentlichen Daten-Refresh) ändern -
    # kurz cachen statt "immutable", damit Updates zeitnah ankommen.
    location /data/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Vite-Asset-Dateinamen enthalten einen Content-Hash -> unbegrenzt cachebar.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA-Fallback: alles andere liefert index.html, React Router übernimmt das Routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
