server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain application/javascript application/json text/css;

    # Fahrplandaten dürfen sich (durch den wöchentlichen Daten-Refresh) ändern -
    # kurz cachen statt "immutable", damit Updates zeitnah ankommen.
    # CORS offen: die Capacitor-Android-App lädt diese Daten von der Origin
    # "https://localhost" nach (siehe app/src/lib/useSchedule.ts, Hintergrund-Refresh der
    # gebündelten Offline-Daten) - unproblematisch, da rein öffentliche, unauthentifizierte
    # Lesedaten ohne Nutzerbezug.
    location /data/ {
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # Vite-Asset-Dateinamen enthalten einen Content-Hash -> unbegrenzt cachebar.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA-Fallback: alles andere liefert index.html, React Router übernimmt das Routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
